name: Bootstrap platform folders
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap.yml]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter --version
      - name: Generate android/ and ios/
        run: |
          flutter create . --platforms=android,ios --org ps.gazanow --project-name gaza_now
          rm -f test/widget_test.dart
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata
          git commit -m "Add generated Android and iOS platform folders"
          git push
