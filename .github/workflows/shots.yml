name: Splash screenshots
on: { push: { branches: [probe] } }
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter test test_goldens --update-goldens
      - name: Publish frames
        run: |
          mkdir /tmp/out && cp test_goldens/frames/*.png /tmp/out/
          cd /tmp/out && git init -q -b shots && git add . && git -c user.name=bot -c user.email=bot@x commit -qm frames
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" shots
