name: Build APK & App Bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional repository secrets (Settings → Secrets → Actions). Builds work without them
      # using Google's test ad IDs and debug signing.
      ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      DART_DEFINES: >-
        --dart-define=NEWSDATA_API_KEY=${{ secrets.NEWSDATA_API_KEY }}
        ${{ secrets.ADMOB_BANNER_ANDROID && format('--dart-define=ADMOB_BANNER_ANDROID={0}', secrets.ADMOB_BANNER_ANDROID) || '' }}
        ${{ secrets.ADMOB_ARTICLE_ANDROID && format('--dart-define=ADMOB_ARTICLE_ANDROID={0}', secrets.ADMOB_ARTICLE_ANDROID) || '' }}
        ${{ secrets.ADMOB_INTERSTITIAL_ANDROID && format('--dart-define=ADMOB_INTERSTITIAL_ANDROID={0}', secrets.ADMOB_INTERSTITIAL_ANDROID) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Release signing (only if keystore secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Release keystore configured"
          else
            echo "No keystore secrets: using debug signing"
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Browser checks (the app must also run in Chrome)
        run: |
          if grep -rn "^import .dart:io" lib/; then echo "dart:io breaks the browser build"; exit 1; fi
          flutter build web --release

      - name: Build release APK
        run: flutter build apk --release $DART_DEFINES

      - name: Build Play Store bundle (AAB)
        run: flutter build appbundle --release $DART_DEFINES

      - uses: actions/upload-artifact@v4
        with:
          name: gaza-now-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gaza-now-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Publish GitHub release (direct APK download link)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk gaza-now.apk
          cp build/app/outputs/bundle/release/app-release.aab gaza-now.aab
          if ! gh release view "v$V" >/dev/null 2>&1; then
            gh release create "v$V" --title "غزة الآن $V" --latest \
              --notes "تطبيق غزة الآن $V. ثبّت gaza-now.apk على هاتف أندرويد، أو ارفع gaza-now.aab على Google Play."
          fi
          gh release upload "v$V" gaza-now.apk gaza-now.aab --clobber
