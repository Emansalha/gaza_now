name: gaza_now
description: Gaza Now - Arabic-first news app for the Gaza Strip.
publish_to: "none"
version: 1.7.2+13

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  xml: ^6.5.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  share_plus: ^10.1.4
  google_mobile_ads: ">=6.0.0 <10.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  # Arabic font bundled with the app (SIL Open Font License, see assets/fonts/OFL.txt)
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800

# App icon:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0D2153"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png

# Native launch screen shown before Flutter starts:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A0C33"
  image: assets/images/splash_native.png
  android_12:
    color: "#0A0C33"
    image: assets/images/splash_native.png
